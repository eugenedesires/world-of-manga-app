    function log(msg, type='info') {
      const div = document.getElementById('log');
      div.innerHTML += `<div class="${type}">${msg}</div>`;
      div.scrollTop = div.scrollHeight;
    }

    window.startImport = async function() {
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = '⏳ Import en cours...';
      log('🚀 Démarrage de l\'import...', 'info');

      let success = 0;
      let errors = 0;

      for (const product of products) {
        try {
          const data = { ...product };
          if (data.image === null) delete data.image;
          if (data.badge === null) delete data.badge;
          await addDoc(collection(db, 'produits'), data);
          log(`✅ ${product.name}`, 'ok');
          success++;
        } catch (e) {
          log(`❌ Erreur sur ${product.name}: ${e.message}`, 'err');
          errors++;
        }
      }

      log(`<br>🎉 Import terminé ! ${success} produits importés, ${errors} erreurs.`, 'info');
      btn.textContent = '✅ Import terminé !';
    };
