    function log(msg, type='info') {
      const div = document.getElementById('log');
      div.innerHTML += `<div class="${type}">${msg}</div>`;
      div.scrollTop = div.scrollHeight;
    }

    window.startDelete = async function() {
      const btn = document.getElementById('btnDelete');
      btn.disabled = true;
      btn.textContent = '⏳ Suppression en cours...';
      log('🗑️ Suppression de tous les produits existants...', 'info');

      try {
        const snap = await getDocs(collection(db, 'produits'));
        let count = 0;
        for (const d of snap.docs) {
          await deleteDoc(doc(db, 'produits', d.id));
          count++;
          if (count % 10 === 0) log(`🗑️ ${count} produits supprimés...`, 'info');
        }
        log(`<br>✅ Suppression terminée ! ${count} produits supprimés au total.`, 'ok');
        btn.textContent = '✅ Suppression terminée';
        document.getElementById('btnImport').disabled = false;
      } catch (e) {
        log(`❌ Erreur : ${e.message}`, 'err');
        btn.disabled = false;
        btn.textContent = '🗑️ Réessayer la suppression';
      }
    };

    window.startImport = async function() {
      const btn = document.getElementById('btnImport');
      btn.disabled = true;
      btn.textContent = '⏳ Import en cours...';
      log('<br>🚀 Démarrage de l\'import propre...', 'info');

      let success = 0;
      let errors = 0;

      for (const product of products) {
        try {
          const data = { ...product };
          if (data.image === null) delete data.image;
          if (data.badge === null) delete data.badge;
          await addDoc(collection(db, 'produits'), data);
          log(`✅ ${product.name}`, 'ok');
          success++;
        } catch (e) {
          log(`❌ Erreur sur ${product.name}: ${e.message}`, 'err');
          errors++;
        }
      }

      log(`<br>🎉 Import terminé ! ${success} produits importés, ${errors} erreurs.`, 'info');
      btn.textContent = '✅ Import terminé !';
    };
